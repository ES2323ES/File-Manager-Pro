name: Build Signed APK & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_slot:
        description: 'Release tag label (e.g. V1, V2, V3, V4) - leave empty for auto-increment'
        required: false
        default: ''

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK (Java Native)
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK & Source ZIP Artifacts
        run: |
          mkdir -p dist-artifacts
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist-artifacts/File-Manager-Pro.apk
          cp "$APK_PATH" dist-artifacts/File-Manager-Pro-v0.2.4.apk
          zip -r dist-artifacts/File-Manager-Pro-v0.2.4-Source.zip . -x ".git/*" "app/build/*" ".gradle/*" "dist-artifacts/*"

      - name: Determine Release Tag (V1, V2, V3, V4...)
        id: calc_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ github.event.inputs.release_slot }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            NEXT_TAG="$MANUAL_TAG"
          else
            LATEST_TITLE=$(gh release list --limit 1 --json name --jq '.[0].name' 2>/dev/null || true)
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ] && echo "$LATEST_TITLE" | grep -q "v0.2.4"; then
              NEXT_TAG="$LATEST_TAG"
            else
              HIGHEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^V[0-9]+$' | sed 's/V//' | sort -nr | head -n 1 || true)
              if [ -z "$HIGHEST" ]; then
                NEXT_TAG="V1"
              else
                NEXT_NUM=$((HIGHEST + 1))
                NEXT_TAG="V${NEXT_NUM}"
              fi
            fi
          fi
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (${{ steps.calc_tag.outputs.tag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.calc_tag.outputs.tag }}
        run: |
          cat <<EOF > release-notes.md
          • אייקון אמיתי לכל קובץ (עטיפת שיר מוטמעת באודיו, תמונה ממוזערת בתמונות וסירטונים, ואייקון מקורי לקובצי APK)
          • הצגת מספר הקבצים בסוגריים ליד המשקל במסך הבית ורענון בהחלקה מלמעלה למטה עד לסיום הסריקה ("כל הקבצים רועננו בהצלחה")
          • נגן אודיו מתקדם עם המשך ניגון ברקע ביציאה מהשיר, שורה תחתונה חכמה (החלקה לעצירה), סמל בבר ההתראות, בחירת מהירות, מצבי חזרה והעברת שיר
          • עורך תמונות מקצועי ועורך וידאו מקצועי עם סמל עיפרון, הגדלה ביד בתמונות ובוידאו, סיבוב מסך, הגדרות וידאו ולחיצה כפולה (+10 / -10)
          • כותרת קובץ נעה תדיר למעלה באמצע ויומן שינויים מפואר וצבעוני

          ### הורדה ישירה
          - **קובץ התקנה לאנדרואיד (APK חתום במפתח קבוע):** \`File-Manager-Pro.apk\`
          - **קובץ התקנה מתויג גירסה 0.2.4:** \`File-Manager-Pro-v0.2.4.apk\`
          - **קובץ קוד מקור מלא של הפרויקט (ZIP):** \`File-Manager-Pro-v0.2.4-Source.zip\`

          ### פיתוח והנדסה
          - **פיתוח והנדסה:** [@ אש התורה](https://mitmachim.top/user/%D7%90%D7%A9-%D7%94%D7%AA%D7%95%D7%A8%D7%94)
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null || true
            gh release edit "$TAG" \
              --title "${TAG} — File Manager Pro v0.2.4" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
            gh release upload "$TAG" \
              dist-artifacts/File-Manager-Pro.apk \
              dist-artifacts/File-Manager-Pro-v0.2.4.apk \
              dist-artifacts/File-Manager-Pro-v0.2.4-Source.zip \
              --clobber
          else
            gh release create "$TAG" \
              dist-artifacts/File-Manager-Pro.apk \
              dist-artifacts/File-Manager-Pro-v0.2.4.apk \
              dist-artifacts/File-Manager-Pro-v0.2.4-Source.zip \
              --target "$GITHUB_SHA" \
              --title "${TAG} — File Manager Pro v0.2.4" \
              --notes-file release-notes.md
          fi
