name: Build Signed APK & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_slot:
        description: 'Release tag label (e.g. V1, V2, V3) - leave empty for auto-increment'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK (Java Native)
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK & Source ZIP Artifacts
        run: |
          mkdir -p dist-artifacts
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist-artifacts/File-Manager-Pro.apk
          cp "$APK_PATH" dist-artifacts/File-Manager-Pro-v0.2.2.apk
          zip -r dist-artifacts/File-Manager-Pro-v0.2.2-Source.zip . -x ".git/*" "app/build/*" ".gradle/*" "dist-artifacts/*"

      - name: Determine Release Tag (V1, V2, V3...)
        id: calc_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ github.event.inputs.release_slot }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            NEXT_TAG="$MANUAL_TAG"
          else
            EXISTING_V1=$(gh release view V1 --json assets --jq '.assets[].name' 2>/dev/null || true)
            HIGHEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^V[0-9]+$' | sed 's/V//' | sort -nr | head -n 1 || true)
            if [ -z "$HIGHEST" ]; then
              NEXT_TAG="V1"
            elif [ "$HIGHEST" = "1" ] && ! echo "$EXISTING_V1" | grep -q "\.apk$"; then
              NEXT_TAG="V1"
            else
              NEXT_NUM=$((HIGHEST + 1))
              NEXT_TAG="V${NEXT_NUM}"
            fi
          fi
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release (${{ steps.calc_tag.outputs.tag }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calc_tag.outputs.tag }}
          name: "${{ steps.calc_tag.outputs.tag }} — File Manager Pro v0.2.2"
          body: |
            ## File Manager Pro — גירסה 0.2.2 (${{ steps.calc_tag.outputs.tag }})
            אפליקציית מנהל קבצים מתקדמת בנייטיב מלא ב-**Java** לאנדרואיד, בפיתוח **אש התורה**.

            ### הורדה ישירה
            - **קובץ התקנה לאנדרואיד (APK חתום במפתח קבוע):** `File-Manager-Pro.apk`
            - **קובץ קוד מקור מלא של הפרויקט (ZIP):** `File-Manager-Pro-v0.2.2-Source.zip`

            ### פרטים טכניים
            - **חתימה דיגיטלית קבועה (SHA-256):** `09:9C:06:BB:29:BB:25:9F:4F:AF:72:94:24:1C:3F:A5:0B:39:89:B3:AD:E6:E5:47:40:EA:77:57:37:2C:FC:DF`
            - **מפתח:** [אש התורה במתמחים טופ](https://mitmachim.top/user/%D7%90%D7%A9-%D7%94%D7%AA%D7%95%D7%A8%D7%94) | [פרופיל GitHub](https://github.com/${{ github.repository_owner }})
          files: |
            dist-artifacts/File-Manager-Pro.apk
            dist-artifacts/File-Manager-Pro-v0.2.2.apk
            dist-artifacts/File-Manager-Pro-v0.2.2-Source.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
