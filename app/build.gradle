plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aishhatorah.filemanagerpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.aishhatorah.filemanagerpro"
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName "0.2.7"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/file-manager-pro-release.p12")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "FileManagerPro2026!"
            keyAlias System.getenv("KEY_ALIAS") ?: "filemanagerpro"
            keyPassword System.getenv("KEY_PASSWORD") ?: "FileManagerPro2026!"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.13.1'
}
